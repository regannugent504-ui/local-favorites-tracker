<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css"> 
</head>


<body> 
    <header class="site-header">
        <h1>Local Favorites Tracker</h1>
        <p class="tagline">Save the places worth going back to, then find them again when you need one.</p>
    </header>
    <section class="add-section">
    <h2>Add New Favorite</h2>
    <form id="add-favorite-form">
        <div class="form-group">
            <label for="name">Place Name *</label>
            <input type="text" id="name" name="name" required aria-required="true">
        </div>
        <!-- category select, rating select, notes textarea -->
        <button type="submit" class="btn btn-primary">Add Favorite</button>
    </form>
</section>

<section class="controls-section">
    <label for="search-input">Search favorites</label>
    <input type="search" id="search-input" placeholder="Search names and notes">

    <label for="category-filter">Filter by category</label>
    <select id="category-filter">
        <option value="all">All categories</option>
        <!-- one option per category you used in the add form -->
    </select>
</section>

<section class="favorites-section">
    <div id="favorites-list" class="favorites-grid">
        <p class="empty-message">No favorites yet. Add your first favorite place above!</p>
    </div>
</section>
<form id="unique-id">
    <label for="input-id">Field Label:</label>
    <input type="text" id="input-id" name="fieldName" required>
    <button type="submit">Submit</button>
</form>
    <footer>
        <p>&copy; 2026 Regan Nugent - Local Favorites Tracker</p>
    </footer>
    
    <script src="js/app.js"></script>
    
</body>
</html>
