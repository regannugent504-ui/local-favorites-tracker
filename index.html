<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Favorites Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>Local Favorites Tracker</h1>
    </header>

    <main>

        <section class="add-section">
            <h2>Add a Favorite</h2>
            <form id="add-favorite-form" novalidate>

                <label for="name">Name</label>
                <input type="text" id="name" placeholder="e.g., Starbucks on South University">
                <p id="name-error" class="error-message" role="alert"></p>


                <label for="category">Category</label>
                <select id="category" name="category" required aria-required="true">                    <option value="">Choose a category</option>
                    <option value="Food">Food</option>
                    <option value="Coffee">Coffee</option>
                    <option value="Parks">Parks</option>
                    <option value="Shopping">Shopping</option>
                </select>
                <p id="category-error" class="error-message" role="alert"></p>


                <label for="rating">Rating</label>
                  <select id="rating" name="rating" required aria-required="true">
                    <option value="">Choose a rating</option>
                    <option value="5">5 stars</option>
                    <option value="4">4 stars</option>
                    <option value="3">3 stars</option>
                    <option value="2">2 stars</option>
                    <option value="1">1 star</option>
                </select>
                <p id="rating-error" class="error-message" role="alert"></p>

                <label for="notes">Notes</label>
                <textarea id="notes" rows="3"></textarea>

                <button type="submit" class="btn-primary">Add Favorite</button>
            </form>
        </section>

        <section class="controls-section">
            <label for="search-input">Search favorites</label>
            <input type="search" id="search-input" placeholder="Search names and notes">

            <label for="category-filter">Filter by category</label>
            <select id="category-filter">
                <option value="all">All categories</option>
                <option value="Food">Food</option>
                <option value="Coffee">Coffee</option>
                <option value="Parks">Parks</option>
                <option value="Shopping">Shopping</option>
            </select>
            
            <label for="rating-filter">Filter by rating</label>
            <select id="rating-filter">
                <option value="all">All ratings</option>
                <option value="5">5 stars</option>
                <option value="4">4 stars</option>
                <option value="3">3 stars</option>
                <option value="2">2 stars</option>
                <option value="1">1 star</option>
           </select>
        </section>

        <section class="favorites-section">
            <h2>Your Favorites</h2>
            <p id="favorites-count"></p>
            <button type="button" id="clear-all" class="btn-danger">Clear All</button>   
            <div id="favorites-list" class="favorites-grid"></div>
        </section>

    </main>

    <footer>
    <p>Regan Nugent  - Local Favorites Tracker </p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
